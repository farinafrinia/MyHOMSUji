  <script>
  (function () {
    var errs = [];
    window.addEventListener('error', function (e) { try { errs.push((e.message || 'Galat') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '')); } catch (x) { } });
    window.addEventListener('unhandledrejection', function (e) { try { errs.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); } catch (x) { } });
    window.__bootGuard = errs;
    setTimeout(function () {
      var b = document.getElementById('boot'); if (!b || b.className.indexOf('out') >= 0 || !b.parentNode) return;
      var d = document.createElement('div'); d.style.cssText = 'max-width:520px;margin:6px 16px 0;text-align:center;font:13px/1.5 system-ui,sans-serif;color:#c9d3e1';
      var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
      var sus = [];
      try {
        if (errs.join(' ').indexOf('SyntaxError') >= 0) {
          var ss = document.getElementsByTagName('script');
          for (var i = 0; i < ss.length && sus.length < 5; i++) {
            var tx = ss[i].text || ''; if (tx.length < 3000) continue; var L = tx.split('\n');
            for (var j = 0; j < L.length && sus.length < 5; j++) {
              var ln = L[j]; var tl = ln.replace(/^\s+/, ''); if (ln.length < 3 || tl.indexOf('/' + '*') === 0 || tl.indexOf('*') === 0 || tl.indexOf('//') === 0) continue;
              try { new Function(ln); } catch (x) {
                if (String(x.message) === 'Invalid or unexpected token') {
                  var odd = []; for (var k = 0; k < ln.length && odd.length < 6; k++) { var c = ln.charCodeAt(k); if (c > 126 || (c < 32 && c !== 9 && c !== 13)) odd.push('U+' + ('0000' + c.toString(16).toUpperCase()).slice(-4) + '@' + k); }
                  sus.push('baris ' + (j + 1) + ' [' + ln.length + ' huruf] ' + (odd.length ? 'karakter: ' + odd.join(',') + ' | ' : '') + ln.slice(0, 110));
                }
              }
            }
          }
        }
      } catch (x2) { sus.push('(pemeriksaan gagal: ' + x2.message + ')'); }
      d.innerHTML = '<div style="font-weight:700;color:#fff;margin-bottom:6px">Pemuatan lebih lama dari biasanya</div><div>' + (errs.length ? 'Terdeteksi galat:<br><code style="color:#FFC7A8;word-break:break-word">' + esc(errs.slice(0, 3).join(' | ')) + '</code>' + (sus.length ? '<br><br>Baris mencurigakan:<br><code style="color:#FFC7A8;word-break:break-all;font-size:11px;display:block;text-align:left">' + esc(sus.join('\n')).replace(/\n/g, '<br>') + '</code>' : '') : 'Server belum menjawab. Tunggu sebentar atau coba muat ulang.') + '</div><div style="margin-top:12px"><button id="bgReload" style="height:36px;padding:0 14px;border-radius:8px;border:0;background:#F26522;color:#fff;font-weight:700;cursor:pointer">Muat ulang</button> <button id="bgClear" style="height:36px;padding:0 14px;border-radius:8px;border:1px solid #475569;background:transparent;color:#c9d3e1;font-weight:600;cursor:pointer">Hapus data lokal &amp; muat ulang</button></div>';
      b.appendChild(d);
      document.getElementById('bgReload').onclick = function () { location.reload(); };
      document.getElementById('bgClear').onclick = function () { try { localStorage.clear(); } catch (x) { } try { sessionStorage.clear(); } catch (x) { } location.reload(); };
    }, (window.__BOOT_T || 12000));
  })();
  </script>
